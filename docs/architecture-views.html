      { h: "Key decisions", items: ["Amount, currency and receipt are decided by the backend from the contribution obligation; Checkout receives them read-only. The response DTO exposes the public key only.", "Verification checks the persisted <code>ProviderOrderId</code>, the HMAC, then fetches the provider payment and order and rejects any amount/currency/capture mismatch as a sticky <code>RECONCILIATION_REQUIRED</code> hold — never silently corrected.", "Webhook signature uses <code>Payment_WebhookSecret</code> over the raw bytes; the event key (<code>X-Razorpay-Event-Id</code> or body hash) makes duplicates no-ops and rejects reuse with a different payload.", "A confirmed full refund creates a <em>reversing</em> journal and reopens the contribution; the original journal is preserved."] },

      { h: "Evidence", items: ["<code>packages/features/src/payments/payment-checkout.tsx</code>", "<code>backend/src/Modules/Payments/*/PaymentService.cs</code>, <code>RazorpayGateway.cs</code>, <code>PaymentEndpoints.cs</code>", "<code>backend/src/Modules/Groups/*/Services/ContributionSettlementService.cs</code>", "<code>backend/src/Modules/Ledger/*</code> (ILedgerPostingService, ChartOfAccounts)", "<code>backend/tests/Dhanvi.IntegrationTests/Api/PaymentEndpointTests.cs</code>", "<code>docs/razorpay-test-smoke-report.md</code>"] },

/* ---------------- Layout engine (no hand-placed coordinates) ---------------- */
const NW = 210, NH = 60, GAP = 24, LANE_PAD = 34, LANE_GAP = 46, M = 30;
function layout(view) {
  const pos = {}; const bands = [];
  if (view.layout === "rows") {
    const maxN = Math.max(...view.lanes.map((l) => l.nodes.length)), perRow = Math.min(maxN, 6);
    let y = M;
    view.lanes.forEach((lane) => {
      const rows = Math.ceil(lane.nodes.length / perRow);
      const cols = Math.min(lane.nodes.length, perRow);
      const width = cols * NW + (cols - 1) * GAP + LANE_PAD * 2; const height = LANE_PAD + rows * NH + (rows - 1) * GAP + LANE_PAD / 2;
      const laneW = perRow * NW + (perRow - 1) * GAP + LANE_PAD * 2; const offset = (laneW - width) / 2;
      lane.nodes.forEach((n, i) => { const r = Math.floor(i / perRow), c = i % perRow; pos[n.id] = { x: M + offset + LANE_PAD + c * (NW + GAP), y: y + LANE_PAD + r * (NH + GAP), w: NW, h: NH, n }; });
      bands.push({ x: M, y, w: laneW, h: height, label: lane.label }); y += height + LANE_GAP;
    });
    return { pos, bands, W: M * 2 + Math.min(maxN, 6) * NW + (Math.min(maxN, 6) - 1) * GAP + LANE_PAD * 2, H: y - LANE_GAP + M };
  }
  const maxN = Math.max(...view.lanes.map((l) => l.nodes.length)); let x = M;
  const laneH = LANE_PAD + maxN * NH + (maxN - 1) * GAP + LANE_PAD / 2;
  view.lanes.forEach((lane) => {
    lane.nodes.forEach((n, i) => { pos[n.id] = { x: x + LANE_PAD, y: M + LANE_PAD + i * (NH + GAP), w: NW, h: NH, n }; });
    bands.push({ x, y: M, w: NW + LANE_PAD * 2, h: laneH, label: lane.label }); x += NW + LANE_PAD * 2 + LANE_GAP;
  });
  return { pos, bands, W: x - LANE_GAP + M, H: M * 2 + laneH };
}

/* ---------------- Rendering ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const n = document.createElementNS(SVGNS, t); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
const svg = document.getElementById("svg");
const state = { view: null, scale: 1, tx: 0, ty: 0, size: { W: 0, H: 0 } };
function anchor(a, b) { const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2; if (Math.abs(by - ay) < a.h) return { x: bx > ax ? a.x + a.w : a.x, y: ay, v: false }; return { x: ax, y: by > ay ? a.y + a.h : a.y, v: true }; }
function placeLabel(p1, c1, c2, p2, text, placed) {
  const at = (t) => { const u = 1 - t; return { x: u*u*u*p1.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p2.x, y: u*u*u*p1.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p2.y }; };
  const w = text.length * 5.2 + 8; let best = at(0.5);
  outer: for (const t of [0.5, 0.38, 0.62, 0.28, 0.72, 0.2, 0.8, 0.12, 0.88]) for (const dy of [0, -13, 13, -26, 26]) { const p0 = at(t); const pt = { x: p0.x, y: p0.y + dy }; if (!placed.some((q) => Math.abs(q.y - pt.y) < 12 && Math.abs(q.x - pt.x) < (q.w + w) / 2 + 4)) { best = pt; break outer; } }
  placed.push({ x: best.x, y: best.y, w }); return best;
}
function wrap(text, max) { const words = String(text).split(" "); const lines = [""]; for (const w of words) { if ((lines[lines.length - 1] + " " + w).trim().length > max) lines.push(w); else lines[lines.length - 1] = (lines[lines.length - 1] + " " + w).trim(); } return lines.slice(0, 2).map((l, i, arr) => (i === 1 && arr.length === 2 && l.length > max ? l.slice(0, max - 1) + "…" : l)); }
function renderView(view) {
  state.view = view; const L = layout(view); state.size = { W: L.W, H: L.H };
  svg.innerHTML = ""; svg.setAttribute("width", L.W); svg.setAttribute("height", L.H);
  const defs = el("defs", {}, svg); const mk = el("marker", { id: "arrow", viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, defs); el("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--muted)" }, mk);
  for (const b of L.bands) { el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, class: "band" }, svg); const t = el("text", { x: b.x + 12, y: b.y + 18, class: "band-label" }, svg); t.textContent = b.label; }
  const seen = new Set(); const placed = [];
  for (const [from, to, kind, label] of view.edges) {
    const key = from + "→" + to; if (seen.has(key)) { console.warn("duplicate edge", key); continue; } seen.add(key);
    const a = L.pos[from], b = L.pos[to]; if (!a || !b) { console.warn("edge references unknown node", from, to); continue; }
    const p1 = anchor(a, b), p2 = anchor(b, a); const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const c1 = p1.v ? { x: p1.x, y: p1.y + dy * .45 } : { x: p1.x + dx * .45, y: p1.y }; const c2 = p2.v ? { x: p2.x, y: p2.y - dy * .45 } : { x: p2.x - dx * .45, y: p2.y };
    const e = EDGE[kind]; el("path", { d: `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, class: "edge", style: `--ec:${e.c};stroke-dasharray:${e.d}` }, svg);
    if (label) { const { x: mx, y: my } = placeLabel(p1, c1, c2, p2, label, placed); const t = el("text", { x: mx, y: my - 3, class: "edge-label" }, svg); t.textContent = label; }
  }
  for (const id in L.pos) {
    const p = L.pos[id], n = p.n;
    const g = el("g", { class: `node${n.cat === "gateway" ? " gateway" : ""}${n.dormant ? " dormant" : ""}`, tabindex: "0", role: "img", "aria-label": `${n.title}. ${n.meta}`, style: `--nc:${CAT[n.cat]}`, transform: `translate(${p.x},${p.y})` }, svg);
    el("rect", { width: p.w, height: p.h }, g);
    const title = el("text", { x: 10, y: 22, class: "title" }, g); title.textContent = n.title.length > 28 ? n.title.slice(0, 27) + "…" : n.title;
    wrap(n.meta, 35).forEach((line, i) => { const t = el("text", { x: 10, y: 38 + i * 12, class: "meta" }, g); t.textContent = line; });
    g.addEventListener("focus", () => { g.querySelector("rect").setAttribute("stroke-width", "3"); }); g.addEventListener("blur", () => { g.querySelector("rect").setAttribute("stroke-width", n.cat === "gateway" ? "3.5" : "1.5"); });
  }
  document.getElementById("vh-title").textContent = `${view.n}. ${view.title}`; document.getElementById("vh-sub").textContent = view.sub;
  document.getElementById("panel").innerHTML = view.notes.map((s) => `<h3>${s.h}</h3><ul>${s.items.map((i) => `<li>${i}</li>`).join("")}</ul>`).join("");
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === view.id)));
  fit();
}
/* ---------------- Pan / zoom ---------------- */
const stage = document.getElementById("stage"), world = document.getElementById("world");
const apply = () => { world.style.transform = `translate(${state.tx}px,${state.ty}px) scale(${state.scale})`; };
function fit() { const r = stage.getBoundingClientRect(); state.scale = Math.max(.25, Math.min(2.4, Math.min((r.width - 40) / state.size.W, (r.height - 40) / state.size.H, 1.3))); state.tx = (r.width - state.size.W * state.scale) / 2; state.ty = 20; apply(); }
function zoom(f, px, py) { const r = stage.getBoundingClientRect(); px = px ?? r.width / 2; py = py ?? r.height / 2; const next = Math.max(.25, Math.min(2.4, state.scale * f)); state.tx = px - (px - state.tx) * (next / state.scale); state.ty = py - (py - state.ty) * (next / state.scale); state.scale = next; apply(); }
let drag = null;
stage.addEventListener("mousedown", (e) => { if (e.target.closest("#legend") || e.target.closest("#zoomctl")) return; drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty }; stage.classList.add("dragging"); });
window.addEventListener("mousemove", (e) => { if (!drag) return; state.tx = drag.tx + e.clientX - drag.x; state.ty = drag.ty + e.clientY - drag.y; apply(); });
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });
stage.addEventListener("wheel", (e) => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.1 : .9, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
document.getElementById("zin").addEventListener("click", () => zoom(1.2)); document.getElementById("zout").addEventListener("click", () => zoom(1 / 1.2)); document.getElementById("zfit").addEventListener("click", fit);
window.addEventListener("resize", fit);
/* ---------------- Nav, theme, print, legend ---------------- */
const nav = document.getElementById("views"); let lastGroup = "";
for (const v of VIEWS) { if (v.group !== lastGroup) { const h = document.createElement("h4"); h.textContent = v.group; nav.appendChild(h); lastGroup = v.group; } const b = document.createElement("button"); b.dataset.id = v.id; b.innerHTML = `<span class="n">${v.n}</span>${v.label}`; b.addEventListener("click", () => { location.hash = v.id; }); nav.appendChild(b); }
function open() { const id = location.hash.replace("#", "") || "high"; renderView(VIEWS.find((v) => v.id === id) ?? VIEWS[0]); }
window.addEventListener("hashchange", open);
document.getElementById("print").addEventListener("click", () => window.print());
const themeBtn = document.getElementById("theme");
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); themeBtn.textContent = "Theme: " + (t || "auto"); }
themeBtn.addEventListener("click", () => { const cur = document.documentElement.getAttribute("data-theme"); const next = cur === "dark" ? "light" : cur === "light" ? null : "dark"; try { next ? localStorage.setItem("dhanvi-arch-theme", next) : localStorage.removeItem("dhanvi-arch-theme"); } catch {} applyTheme(next); });
try { applyTheme(localStorage.getItem("dhanvi-arch-theme")); } catch { applyTheme(null); }
const legend = document.getElementById("legend"), head = legend.querySelector(".legend-head");
const toggleLegend = () => { legend.classList.toggle("collapsed"); head.setAttribute("aria-expanded", String(!legend.classList.contains("collapsed"))); head.lastElementChild.textContent = legend.classList.contains("collapsed") ? "▸" : "▾"; };
head.addEventListener("click", toggleLegend); head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleLegend(); } });
document.getElementById("legend-body").innerHTML = `<div>${Object.entries(CAT).map(([k, c]) => `<div class="row"><span class="sq" style="border-color:${c};background:color-mix(in srgb, ${c} 20%, transparent)"></span>${CAT_LABEL[k]}</div>`).join("")}<div class="row"><span class="sq" style="border-color:var(--muted);border-style:dashed"></span>dashed box = dormant / not implemented</div></div>` +
  `<div>${Object.values(EDGE).map((e) => `<div class="row"><span class="ln" style="border-color:${e.c};border-top-style:${e.d ? "dashed" : "solid"}"></span>${e.label}</div>`).join("")}<div class="row" style="color:var(--muted)">Drag to pan · wheel / ＋ － to zoom · Fit resets</div></div>`;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { document.activeElement?.blur?.(); } });
open();
