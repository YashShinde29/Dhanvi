name: dhanvi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dhanvi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:3000;http://localhost:3001}
      Database__ApplyMigrations: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__SecureCookies: "false"
      DHANVI_SEED_ADMIN_ENABLED: ${DHANVI_SEED_ADMIN_ENABLED:-false}
      DHANVI_SEED_ADMIN_EMAIL: ${DHANVI_SEED_ADMIN_EMAIL:-}
      DHANVI_SEED_ADMIN_PASSWORD: ${DHANVI_SEED_ADMIN_PASSWORD:-}
      Payments__Razorpay__Enabled: "${PAYMENTS_RAZORPAY_ENABLED:-false}"
      RAZORPAY_ENVIRONMENT: "${RAZORPAY_ENVIRONMENT:-TEST}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_MIN_GROUP_MEMBERS: "2"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_USER_APP_URL: ${USER_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_MIN_GROUP_MEMBERS: "2"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_USER_APP_URL: ${USER_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      - backend

volumes:
  dhanvi-postgres-data:
